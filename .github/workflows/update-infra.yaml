name: Update infrastructure
run-name: Push changes to mle infrastructure 🚀
on: 
  push:
    branches:
      - main

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mle-${{github.event.repository.name}}:${{ github.sha }}

      - name: Check our infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: minor-league-esports/infrastructure
          token: ${{ secrets.CLONE_PAT }}
          ref: main
          path: infrastructure

      - name: Set up Git
        run: |
          git config --global user.email ""
          git config --global user.name "MLEDBAutomoton"

      - name: Get current branch name
        id: get_branch
        run: echo "BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Create or update feature branch
        run: |
          cd infrastructure
          mkdir -p projects/${{github.event.repository.name}}
          git fetch origin

          export REPO_NAME="${{github.event.repository.name}}"
          export LOCAL_BRANCH="${{steps.get_branch.outputs.BRANCH_NAME}}"
          export INFRA_BRANCH="${REPO_NAME}/${LOCAL_BRANCH}"
          
          if git ls-remote --exit-code --heads origin $INFRA_BRANCH; then
            git checkout $INFRA_BRANCH
            git pull origin $INFRA_BRANCH
          else
            git checkout -b $INFRA_BRANCH
          fi

      - name: Update infrastructure
        run: |
          cd infrastructure
          mkdir -p projects/${{github.event.repository.name}}
          echo ${{steps.build_and_push.outputs.digest}} > projects/${{github.event.repository.name}}/image-digest
          git add .
          git commit -m "[Automated ${{github.repository}}] ${{github.sha}}"

          export REPO_NAME="${{github.event.repository.name}}"
          export LOCAL_BRANCH="${{steps.get_branch.outputs.BRANCH_NAME}}"
          export INFRA_BRANCH="${REPO_NAME}/${LOCAL_BRANCH}"
          git push -u origin $INFRA_BRANCH

      - name: Create PR if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.CLONE_PAT }}
        run: |
          cd infrastructure
          REPO_NAME="${{github.event.repository.name}}"
          LOCAL_BRANCH="${{steps.get_branch.outputs.BRANCH_NAME}}"
          INFRA_BRANCH="${REPO_NAME}/${LOCAL_BRANCH}"
          PR_EXISTS=$(gh pr list --head $INFRA_BRANCH --json number --jq length)
          if [ "$PR_EXISTS" -eq "0" ]; then
            gh pr create --title "Update ${{github.event.repository.name}} infrastructure" --body "Automated update for ${{github.event.repository.name}} with commit ${{github.sha}}" --head $INFRA_BRANCH --base main
          else
            echo "PR already exists. Skipping PR creation."
          fi
