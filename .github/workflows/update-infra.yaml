name: Update infrastructure
run-name: Push changes to mle infrastructure 🚀
on: 
  push:
    branches:
      - main

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{github.event.repository.name}}:${{ github.sha }}

      - name: Check our infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: minor-league-esports/infrastructure
          token: ${{ secrets.CLONE_PAT }}
          ref: main
          path: infrastructure

      - name: Update and push infra
        run: |
          cd infrastructure
          echo ${{steps.build_and_push.outputs.digest}} > ${{github.repository}}/image-digest

          git config --global user.email ""
          git config --global user.name "MLEDBAutomoton"
          
          git add .
          git commit -m "[Automated ${{github.repository}}] ${{github.sha}}"
          git push
          

